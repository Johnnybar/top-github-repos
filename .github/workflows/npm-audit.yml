name: NPM Audit

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # every Monday at 03:00 UTC

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run audit
        run: npm audit --audit-level=high
